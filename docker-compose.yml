services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cctv_backend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      mediamtx:
        condition: service_healthy
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: cctv_mediamtx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CCTV_DOMAIN: ${NEXT_PUBLIC_CCTV_DOMAIN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cctv_frontend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
