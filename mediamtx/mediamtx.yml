# ─────────────────────────────────────────────────────────────────────────────
# MediaMTX Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Mengaktifkan HTTP API untuk NestJS Backend (manajemen path dinamis)
api: yes
apiAddress: 0.0.0.0:9997
logLevel: info

# Autentikasi via HTTP ke NestJS Backend
# MediaMTX akan memanggil endpoint ini setiap kali ada request stream masuk
# Backend akan memutuskan apakah akses diizinkan (200) atau ditolak (401)
authMethod: http
authHTTPAddress: http://127.0.0.1:3001/api/v1/mediamtx/auth

# ─────────────────────────────────────────────────────────────────────────────
# Konfigurasi Protokol
# ─────────────────────────────────────────────────────────────────────────────

# RTSP Server
rtsp: yes
rtspAddress: :8554

# HLS Server (digunakan oleh frontend)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsSegmentDuration: 2s
hlsPartDuration: 500ms

# WebRTC (WHEP) - dinonaktifkan sementara, aktifkan jika diperlukan
webrtc: no

# ─────────────────────────────────────────────────────────────────────────────
# Path Kamera yang Sudah Ada (Existing)
# Path baru akan ditambahkan secara dinamis oleh NestJS via REST API
# ─────────────────────────────────────────────────────────────────────────────
paths:
