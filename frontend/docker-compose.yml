version: '3.8'

services:
  cctv-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CCTV_DOMAIN: ${NEXT_PUBLIC_CCTV_DOMAIN:-http://xxx.xxx.xxx.xxx}
    container_name: cctv-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CCTV_DOMAIN=${NEXT_PUBLIC_CCTV_DOMAIN:-http://xxx.xxx.xxx.xxx}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
