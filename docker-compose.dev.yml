services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cctv_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      mediamtx:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - MEDIAMTX_API_URL=http://mediamtx:9997
    networks:
      - cctv_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: cctv_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS (digunakan di frontend)
      - "9997:9997"   # HTTP API (internal, bisa dihilangkan di production)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    networks:
      - cctv_network
    environment:
      - MTX_AUTHHTTPADDRESS=http://backend:3001/api/v1/mediamtx/auth
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CCTV_DOMAIN: ${NEXT_PUBLIC_CCTV_DOMAIN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cctv_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    networks:
      - cctv_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cctv_network:
    driver: bridge
