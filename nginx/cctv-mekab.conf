upstream cctv_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream cctv_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream cctv_mediamtx {
    server 127.0.0.1:8888;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cctv.muaraenimkab.go.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cctv.muaraenimkab.go.id;

    ssl_certificate     /etc/ssl/certs/mekab-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/mekab.key;

    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header X-XSS-Protection       "1; mode=block"         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    access_log /var/log/nginx/cctv-mekab-access.log;
    error_log  /var/log/nginx/cctv-mekab-error.log warn;

    location /api/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout  15s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    location /live/ {
        proxy_pass http://cctv_mediamtx/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;

        proxy_connect_timeout  10s;
        proxy_send_timeout     3600s;   # 1 jam
        proxy_read_timeout     3600s;   # 1 jam
        send_timeout           3600s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                             always;
        add_header Expires       "0"                                    always;

        add_header Access-Control-Allow-Origin  "*"                          always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"               always;
        add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type" always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age       1728000;
            add_header Content-Type                 "text/plain; charset=utf-8";
            add_header Content-Length               0;
            return 204;
        }
    }

    location / {
        proxy_pass http://cctv_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout untuk SSR (Server-Side Rendering) Next.js
        proxy_connect_timeout  15s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }
}